<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通讯报名表2</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* 盒子组 */
  body {
    background-color: #36384d;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Roboto', sans-serif;
  }

  .card {
    display: flex;
    flex-direction: column;
    background-color: #fff;
    border-radius: 36px;
    width: 500px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    padding: 60px 64px;
  }

  /* 图片组 */
  .icon-success {
    width: 64px;
    height: 64px;
    margin-bottom: 40px;
  }

  /* 文本组 */
  .title {
    font-size: 40px;
    font-weight: 700;
    color: #36384d;
    line-height: 1.1;
    margin-bottom: 24px;
  }

  .description {
    font-size: 16px;
    font-weight: 400;
    color: #36384d;
    line-height: 1.5;
    margin-bottom: 40px;

  }


  .description strong {
    font-weight: 700;
  }

  /* 提交按钮 */
  .dismiss-btn {
    width: 100%;
    height: 56px;
    background-color: #242742;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  /* 按钮悬停效果*/
  .dismiss-btn:hover {
    background: linear-gradient(to right, hsl(4, 100%, 67%), hsl(18, 100%, 64%));
    box-shadow: 0 15px 25px rgba(255, 98, 87, 0.5);
  }
</style>

<body>
  <!-- 主卡片 -->
  <div class="card">
    <!-- 成功图标-->
    <img class="icon-success" src="./image/通讯报名表/细勾.svg" alt="success">

    <!-- 大标题 -->
    <h1 class="title">Thanks for subscribing!</h1>

    <!-- 描述文本 -->
    <p class="description">
      A confirmation email has been sent to <strong>ash@loremcompany.com</strong>. Please open it and click the button
      inside to confirm your subscription.
    </p>

    <!-- 关闭按钮 -->
    <button class="dismiss-btn" id="dismissBtn">Dismiss message</button>
  </div>

  <script>
    // 给按钮加上点击返回上一页的功能
    document.getElementById('dismissBtn').addEventListener('click', function () {
      // 点击后跳转回第一个页面
      window.location.href = '通讯报名表1.html';
    });
  </script>
</body>

</html>
