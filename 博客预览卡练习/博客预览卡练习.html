<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预览卡练习</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: hsl(47, 88%, 63%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .main_box {
      background-color: hsl(0, 0%, 100%);
      width: 384px;
      padding: 24px;
      border-radius: 20px;
      box-sizing: border-box;
      box-shadow: 8px 8px 0px 0px hsl(0, 0%, 7%);
    }

    .card_img {
      width: 100%;
      border-radius: 12px;

    }

    .Learning {
      color: hsl(0, 0%, 7%);
      background-color: hsl(47, 88%, 63%);
      padding: 4px 12px;
      border-radius: 4px;
      display: inline-block;
      font-size: 14px;
      font-weight: 800;
      margin-top: 15px;
      margin-bottom: 13px;
    }

    .time {
      font-size: 14px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    .content {
      line-height: 1.5;
    }

    .footer {
      display: flex;
      justify-content: flex-start;
      margin-top: 20px;
    }

    .footer img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin-right: 12px;
    }

    .name {
      font-size: 14px;
      font-weight: 800;
      color: hsl(0, 0%, 7%);
    }
  </style>
</head>

<body>
  <div class="main_box">
    <img src="./image/卡片.svg" alt="" class="card_img">
    <p class="Learning">Learning</p>
    <p class="time">Published 21 Dec 2023</p>
    <h2 class="title">HTML & CSS foundations</h2>
    <p class="content">These languages are the backbone of every<br>website, defining structure, content,
      and<br>presentation.</p>
    <div class="footer">
      <img src="./image/卡片界面头像.webp" alt="" class="avatar">
      <p class="name">Greg Hooper</p>



    </div>
  </div>

</body>

</html>
