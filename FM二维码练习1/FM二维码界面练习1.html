<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FM二维码界面练习1</title>

  <style>
    .main_body {
      background-color: hsl(212, 45%, 89%);
    }
  </style>
  <style>
    .main_box {
      background-color: hsl(0, 0%, 100%);
      width: 320px;
      border-radius: 20px;
      padding: 16px;
      margin: 0 auto;
      margin-top: 200px;
    }

    .qr_code {
      width: 100%;
      border-radius: 10px;
    }

    .title_1 {
      font-size: 22px;
      text-align: center;
      color: #1f3251;
    }

    .content {
      font-size: 15px;
      text-align: center;
      margin: 20px 0;
      line-height: 1.5;
      color: #7b879d;
    }
  </style>



</head>

<body class="main_body">
  <!-- 最大的盒子 -->
  <div class="main_box">
    <!-- 二维码图片 -->
    <img src="./image/image-qr-code.png" class="qr_code" alt="">
    <!-- 标题 -->
    <h1 class="title_1">Improve your front-end<br>skills by building projects</h1>
    <!-- 描述 -->
    <p class="content">Scan the QR code to visit Frontend<br>Mentor and take your coding skills to<br> the next level
    </p>
  </div>

</body>

</html>
